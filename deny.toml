# The dependency policy `cargo deny check` enforces.

[graph]
all-features = true

[advisories]
# A vulnerability is always an error; a crate its maintainers have left, an unsound one, or a
# version its registry withdrew is one too, wherever it sits in the graph.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# A user ships this library in open and proprietary products alike, so every crate it builds on
# is under a licence met by carrying its notices; a crate offering a choice is admitted by any one.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
# Transitive crates choose their own versions, as the crate's `multiple_crate_versions` allows.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
